# Push a tag like v2026.11.05 to build, check, and publish the app.
#
# Before tagging, rename "## Unreleased" in CHANGELOG.md to "## 2026.11.05" and
# wait for the Build workflow to pass on the commit being tagged. Three jobs
# follow: build and package on macos-latest; unzip the file that would ship and
# check it on macos-15, the oldest macOS the app claims; then create the GitHub
# release as a draft and make it public. A failure in any job leaves nothing
# public. A draft left behind by a run that failed after creating it must be
# deleted on the Releases page before the run is repeated.
#
# One path stays untested here: a zip downloaded through a browser gets a
# quarantine mark, and Gatekeeper's Open Anyway path runs only for that. These
# jobs never download through a browser. Open the published zip once on a Mac
# that did not build it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
      # gh run list, in "Build passed on this commit".
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Tag is a release date
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "::error::the tag $GITHUB_REF_NAME is not a release date like v2026.11.05"
            exit 1
          fi
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md
        # Fails when CHANGELOG.md has no "## <version>" heading for this tag,
        # or the section is empty. The notes are that section plus the
        # first-launch paragraph; see scripts/release-notes.sh.
        run: |
          mkdir dist
          scripts/release-notes.sh "$GITHUB_REF_NAME" > dist/release-notes.md

      - name: Build passed on this commit
        # The Build workflow runs the guards and, with SUG_KEY, the live
        # SignUpGenius test. This workflow leaves that test out, so a
        # SignUpGenius outage cannot block a tag and a tag run never pulls
        # sign-ups into a runner. A tag pushed in the same moment as its commit
        # fails here until the Build run finishes; run this workflow again then.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          passed=$(gh run list --workflow build.yml --commit "$GITHUB_SHA" --branch main --status success --json databaseId --jq length)
          if [ "$passed" -lt 1 ]; then
            echo "::error::no successful Build run on main for commit $GITHUB_SHA; wait for the Build workflow to pass on it, then run this workflow again"
            exit 1
          fi

      - name: Test
        run: swift test --force-resolved-versions

      - name: Build
        run: scripts/build-app.sh

      - name: Check the app
        run: EXPECT_VERSION="$VERSION" scripts/check-app.sh "build/Eagle Boards.app"

      - name: Refuse to publish data or a key
        env:
          SUG_KEY: ${{ secrets.SUG_KEY }}
        run: |
          app="build/Eagle Boards.app"
          if find "$app" -iname '*.csv' -o -iname '*.properties' -o -iname '*.xls*' | grep .; then
            echo "::error::the app contains data files"
            exit 1
          fi
          if [ -n "$SUG_KEY" ] && grep -rqF "$SUG_KEY" "$app"; then
            echo "::error::the app contains the SignUpGenius key"
            exit 1
          fi

      - name: Package
        run: |
          zip="Eagle-Boards-$VERSION.zip"
          ditto -c -k --keepParent "build/Eagle Boards.app" "dist/$zip"
          (cd dist && shasum -a 256 "$zip" > SHA256SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist
          if-no-files-found: error
          retention-days: 7
          # A repeated run uploads the same name again.
          overwrite: true

  verify:
    # The test of the exact file that ships, on the oldest macOS the release
    # claims: unzip it the way a user does, then run the bundle checks and the
    # launch on that copy.
    needs: build
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - name: Unzip and check the shipped file
        run: |
          case "$(sw_vers -productVersion)" in
            15.*) ;;
            *) echo "::error::expected macOS 15, found $(sw_vers -productVersion)"; exit 1 ;;
          esac
          version="${GITHUB_REF_NAME#v}"
          (cd release && shasum -a 256 -c SHA256SUMS)
          mkdir unzipped
          ditto -x -k "release/Eagle-Boards-$version.zip" unzipped
          EXPECT_VERSION="$version" scripts/check-app.sh "unzipped/Eagle Boards.app"

  publish:
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - name: Check the files are the ones verified
        run: cd release && sha256sum -c SHA256SUMS

      - name: Create the draft release
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::error::a release for $GITHUB_REF_NAME already exists; delete the draft on the Releases page, then run this workflow again"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "release/Eagle-Boards-$version.zip" \
            --draft --verify-tag \
            --title "Eagle Boards $version" \
            --notes-file release/release-notes.md

      - name: Publish
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')
          if [ "$assets" != 1 ]; then
            echo "::error::the draft for $GITHUB_REF_NAME has $assets files, expected the one zip"
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false
          gh release view "$GITHUB_REF_NAME" --json url,isDraft
