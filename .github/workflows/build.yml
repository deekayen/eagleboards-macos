# The acceptance gate. Everything here must stay green on main.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    env:
      VERSION: 0.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: No decompiled variable names
        # Names say what a variable is for. var1, var10 and friends came from
        # a decompiler in the Java project and are not allowed back.
        run: |
          if grep -rnE '\bvar[0-9]+\b' Sources Tests scripts; then
            echo "::error::decompiler-style var## names found"
            exit 1
          fi

      - name: Swift formatting
        # Apple's swift-format, which ships with Xcode, configured by
        # .swift-format (4-space indent, 120 columns). Run
        # `xcrun swift-format format -i --recursive Sources Tests` to fix.
        run: xcrun swift-format lint --strict --recursive Sources Tests

      - name: No participant data in the tree
        # The same patterns as scripts/hooks/pre-commit and .gitignore, for a
        # file that got in anyway. Change all three together.
        run: |
          if git ls-files | grep -Ei '\.(csv|xls|xlsx|xlsm|ods|jar)$|Master_AdultHistory|Board_Results|LOGIN_INFO|(^|/)20[0-9]{2}-[0-9]{2}-[0-9]{2}/|(^|/)config\.properties$|(^|/)\.env$'; then
            echo "::error::data files or secrets are tracked"
            exit 1
          fi

      - name: No SignUpGenius key in the tree
        # The regex is read out of scripts/hooks/pre-commit, so the hook and
        # this step cannot drift apart. It looks at the current tree only; the
        # hook is what stops a key at commit time.
        run: |
          pattern=$(sed -n "s/.*git diff --cached -G'\(.*\)' --name-only.*/\1/p" scripts/hooks/pre-commit)
          [ -n "$pattern" ] || { echo "::error::could not read the key pattern from scripts/hooks/pre-commit"; exit 1; }
          if git grep -nE "$pattern"; then
            echo "::error::a tracked file contains what looks like a SignUpGenius key"
            exit 1
          fi

      - name: Check-in pages match eagleboards-shared (SPEC.md D-18)
        # The check-in pages are designed once, in eagleboards-shared/checkin,
        # and every version serves them unchanged. checkin-pages.lock pins the
        # commit; a copy edited here instead of there fails the build.
        run: |
          SHA=$(tr -d '[:space:]' < checkin-pages.lock)
          for f in index.html youth_register.html adult_register.html checkin.css checkin.js; do
            curl -sfL --retry 3 "https://raw.githubusercontent.com/deekayen/eagleboards-shared/$SHA/checkin/$f" -o "shared-$f" \
              || { echo "FAIL: could not fetch checkin/$f at eagleboards-shared@$SHA"; exit 1; }
            if ! cmp -s "shared-$f" "Sources/CheckInServer/Resources/CheckIn/$f"; then
              echo "FAIL: Resources/CheckIn/$f differs from eagleboards-shared@$SHA."
              echo "      Edit it in eagleboards-shared/checkin, copy all five files here, and update checkin-pages.lock."
              exit 1
            fi
          done
          echo "check-in pages match eagleboards-shared@$SHA"

      - name: Rule and auto-select cases match eagleboards-shared (SPEC.md D-5)
        # The cases are written once, in eagleboards-shared/cases, and every
        # version runs all of them (SharedCaseTests). test-cases.lock pins the
        # commit; a case edited, added or dropped here instead of there fails
        # the build. The whole folder is fetched, so a case added there and
        # not copied here is caught too.
        run: |
          SHA=$(tr -d '[:space:]' < test-cases.lock)
          ours=Tests/EagleBoardsCoreTests/Resources/cases
          mkdir shared-cases
          curl -sfL --retry 3 "https://codeload.github.com/deekayen/eagleboards-shared/tar.gz/$SHA" -o shared-cases.tar.gz \
            || { echo "FAIL: could not fetch eagleboards-shared@$SHA"; exit 1; }
          tar -xzf shared-cases.tar.gz -C shared-cases --strip-components=1
          if ! diff <(cd shared-cases/cases && ls *.json) <(cd "$ours" && ls *.json); then
            echo "FAIL: $ours does not hold the same files as eagleboards-shared@$SHA/cases."
            exit 1
          fi
          for f in shared-cases/cases/*.json; do
            if ! cmp -s "$f" "$ours/$(basename "$f")"; then
              echo "FAIL: $ours/$(basename "$f") differs from eagleboards-shared@$SHA."
              echo "      Change it in eagleboards-shared/cases, copy the *.json here, and update test-cases.lock."
              exit 1
            fi
          done
          echo "rule and auto-select cases match eagleboards-shared@$SHA"

      - name: Test
        env:
          # Only enables the live SignUpGenius check; absent on forks and
          # Dependabot runs, where that one test is skipped.
          SUG_KEY: ${{ secrets.SUG_KEY }}
        # --force-resolved-versions fails when Package.resolved no longer
        # satisfies Package.swift, where a plain run would rewrite it and go on.
        run: swift test --force-resolved-versions

      - name: Build the app
        run: scripts/build-app.sh

      - name: Check the app
        # The bundle checks and the launch smoke test, in scripts/check-app.sh
        # so release.yml runs the same ones on the zip it ships.
        run: EXPECT_VERSION="$VERSION" scripts/check-app.sh "build/Eagle Boards.app"

  macos15:
    # Backs the claim that the app runs on macOS 15, its minimum. As of
    # 2026-11-03 macos-latest is macOS 26, and GitHub retired its macOS 14
    # image on 2026-11-02, so macOS 15 is the oldest release CI can test. This
    # job runs the tests and launches the built app there, with Xcode 26 as
    # the build job uses. It repeats none of the repository guards, and skips
    # the live SignUpGenius test because it has no SUG_KEY.
    runs-on: macos-15
    env:
      VERSION: 0.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode 26
        # The image's default Xcode is 16.4; Xcode 26.x is installed beside it
        # as /Applications/Xcode_26.N.app. Take the newest that is not a beta.
        run: |
          case "$(sw_vers -productVersion)" in
            15.*) ;;
            *) echo "::error::expected macOS 15, found $(sw_vers -productVersion)"; exit 1 ;;
          esac
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1 || true)
          if [ -z "$xcode" ]; then
            echo "::error::no Xcode 26 under /Applications on this runner image; see the image's installed software list"
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          echo "using $xcode on macOS $(sw_vers -productVersion)"

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test --force-resolved-versions

      - name: Build the app
        run: scripts/build-app.sh

      - name: Check the app
        run: EXPECT_VERSION="$VERSION" scripts/check-app.sh "build/Eagle Boards.app"
