<!DOCTYPE html>
<html lang="en">
   <head>
      <title>Adult Sign-In</title>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" type="text/css" href="checkin.css"/>
      <script src="checkin.js"></script>
   </head>
   <body class="eb-public">
      <div class="reg-head">
         <span class="page-subheader">Adult Sign-In</span>
      </div>

      <!-- Same single-column, top-label structure as the youth form; see the
           note there for the research behind it. -->
      <div class="reg-wrap">
         <form id="regForm" autocomplete="off">
            <fieldset>
               <legend>Adult registration</legend>
               <div class="reg-field">
                  <label for="Email">Email</label>
                  <!-- type="text", not type="email": NONE is a legal value and
                       type="email" would reject it. -->
                  <input type="text" id="Email" name="Email" required
                         inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false"
                         title="Enter Email. If none, enter NONE.">
               </div>
               <input type="hidden" name="ID" value="">
               <div class="reg-pair">
                  <div class="reg-field">
                     <label for="First">First name</label>
                     <input type="text" id="First" name="First" required>
                  </div>
                  <div class="reg-field">
                     <label for="Last">Last name</label>
                     <input type="text" id="Last" name="Last" required>
                  </div>
               </div>
               <div class="reg-field">
                  <label for="Phone">Phone</label>
                  <input type="tel" id="Phone" name="Phone" required inputmode="tel">
               </div>
               <div class="reg-pair">
                  <div class="reg-field reg-grow">
                     <label for="UnitType">Unit type</label>
                     <select id="UnitType" name="UnitType" required>
                        <option value="Troop">Troop</option>
                        <option value="Post">Post</option>
                        <option value="Crew">Crew</option>
                        <option value="Ship">Ship</option>
                        <option value="Pack">Pack</option>
                        <!-- Adults can serve from a district, council or
                             community role rather than a numbered unit. Unit #
                             is disabled for these three. -->
                        <option value="District">District</option>
                        <option value="Council">Council</option>
                        <option value="Community">Community</option>
                     </select>
                  </div>
                  <div class="reg-field reg-narrow" id="unitField">
                     <label for="Unit">Unit #</label>
                     <input type="text" id="Unit" name="Unit" required pattern="[0-9]+"
                            inputmode="numeric" title="Unit # must be a whole number.">
                  </div>
               </div>
            </fieldset>
            <fieldset>
               <legend>I can serve as</legend>
               <div class="reg-pair">
                  <div class="reg-field">
                     <label for="FinalBoard">Final Board</label>
                     <select id="FinalBoard" name="FinalBoard" required>
                        <option value="Member">Member</option>
                        <option value="Chair">Chair</option>
                        <!-- Stored as the role "Unavailable", which the
                             scheduler and Seat Board keep off that kind of board. -->
                        <option value="Unavailable">No thanks</option>
                     </select>
                  </div>
                  <div class="reg-field">
                     <label for="ProjectReview">Proposal Review</label>
                     <select id="ProjectReview" name="ProjectReview" required>
                        <option value="Member">Member</option>
                        <option value="Chair">Chair</option>
                        <option value="Unavailable">No thanks</option>
                     </select>
                  </div>
               </div>
            </fieldset>

            <!-- Tonight only: neither answer is kept in the adult history, so
                 next month's form does not pre-fill last month's. -->
            <fieldset>
               <legend>Tonight</legend>
               <label class="reg-check">
                  <input type="checkbox" id="WoodBadge">
                  I'm volunteering toward a Wood Badge ticket item
               </label>
               <div class="reg-field">
                  <label for="scoutFilter">I'm here supporting a scout</label>
                  <p class="reg-hint">Their Scoutmaster, coach or parent? Check each scout you came
                     with, so we can find you when their review starts. Leave it empty if
                     you're here to serve on any board.</p>
                  <input type="text" id="scoutFilter" placeholder="Type a name to narrow the list">
                  <div id="scoutList" class="reg-scouts" role="group" aria-label="Scouts">
                     <span class="reg-hint">Loading scouts...</span>
                  </div>
               </div>
            </fieldset>
            <div id="statusMsg" role="status"></div>
            <div class="reg-buttons">
               <button type="submit" id="registerBtn"><b>Register</b></button>
               <button type="button" id="cancelBtn"><b>Cancel</b></button>
            </div>
         </form>
      </div>

      <script>
         var form = document.getElementById("regForm");

         // Someone serving from a district, council or community role has no
         // unit number, so the box is disabled and cleared rather than left to
         // be filled with a placeholder like 0 or N/A.
         var UNITLESS_TYPES = ["District", "Council", "Community"];
         var unitField = document.getElementById("unitField");
         function syncUnitField() {
            var unitless = UNITLESS_TYPES.indexOf(form.elements["UnitType"].value) >= 0;
            var unit = form.elements["Unit"];
            if (unitless) {
               unit.value = "";
            }
            // Dropping `required` is what lets the form submit with the box
            // the person was never allowed to fill in.
            unit.disabled = unitless;
            unit.required = !unitless;
            unitField.className = unitless ? "reg-field reg-narrow is-disabled" : "reg-field reg-narrow";
         }
         form.elements["UnitType"].addEventListener("change", syncUnitField);
         syncUnitField();

         ebWireEmailPrefill(form, "/api/adult-lookup",
            ["ID", "Last", "First", "Phone", "UnitType", "Unit", "FinalBoard", "ProjectReview"]);
         // The youth an adult may say they came to support: RSVPs and
         // tonight's walk-ins whose evening is not over, names and units only.
         var scoutList = document.getElementById("scoutList");
         var scoutFilter = document.getElementById("scoutFilter");
         ebScoutChoices().then(function (scouts) {
            scoutList.textContent = "";
            if (scouts.length === 0) {
               var none = document.createElement("span");
               none.className = "reg-hint";
               none.textContent = "No scouts are signed up yet.";
               scoutList.appendChild(none);
               return;
            }
            scouts.forEach(function (s) {
               var label = document.createElement("label");
               label.className = "reg-check";
               var box = document.createElement("input");
               box.type = "checkbox";
               box.value = s.id;
               label.appendChild(box);
               var unit = s.unitType + (s.unit ? " " + s.unit : "");
               label.appendChild(document.createTextNode(
                  " " + s.first + " " + s.last + (unit.trim() ? " (" + unit.trim() + ")" : "")));
               scoutList.appendChild(label);
            });
         }).catch(function () {
            scoutList.textContent = "Could not load the scouts. You can still sign in.";
         });

         scoutFilter.addEventListener("input", function () {
            var needle = scoutFilter.value.trim().toLowerCase();
            Array.prototype.forEach.call(scoutList.querySelectorAll("label"), function (label) {
               var box = label.querySelector("input");
               // A checked scout stays visible, so narrowing never hides a choice.
               label.style.display = (!needle || box.checked
                  || label.textContent.toLowerCase().indexOf(needle) >= 0) ? "" : "none";
            });
         });

         ebWireRegistration(form, "/register-adult",
            ["Email", "ID", "Last", "First", "Phone", "UnitType", "Unit", "FinalBoard", "ProjectReview"],
            function (values) {
               if (values.FinalBoard === "Unavailable" && values.ProjectReview === "Unavailable") {
                  return "Please choose at least one kind of board you can serve on.";
               }
               values.WoodBadge = document.getElementById("WoodBadge").checked ? "Y" : "";
               // "|" rather than ",": the data files turn commas into "~".
               values.Supporting = Array.prototype.map.call(
                  scoutList.querySelectorAll("input:checked"), function (box) { return box.value; }).join("|");
               return null;
            });
      </script>
   </body>
</html>
